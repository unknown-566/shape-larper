name: Build desktop app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['claude/**']
    paths: ['index.html', 'electron/**', 'package.json', 'package-lock.json', '.github/workflows/build.yml']
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: shape-larper-${{ matrix.target }}
          path: dist/
