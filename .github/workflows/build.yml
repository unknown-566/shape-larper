name: Build desktop app
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
    paths: ['index.html', 'boot.js', 'soundtrack.js', 'boss-pressure.js', 'balance.js', 'desktop.js', 'menus.js', 'updates.js', 'effects.js', 'relay-client.js', 'relay/**', 'render.yaml', 'progression.js', 'multiplayer.js', 'electron/**', 'package.json', 'package-lock.json', '.github/workflows/build.yml']
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    # macOS runners are often unavailable; that must not block the Windows and Linux downloads
    continue-on-error: ${{ matrix.target == 'mac' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:${{ matrix.target }}
      - name: Package deployable relay (Windows)
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path relay,render.yaml -DestinationPath "dist/ShapeLarper-Relay-v$version.zip"
      - name: Zip (macOS)
        if: matrix.target == 'mac'
        run: ditto -c -k --keepParent "dist/Shape Larper-darwin-universal/Shape Larper.app" ShapeLarper-mac-universal.zip
      - name: Zip (Linux)
        if: matrix.target == 'linux'
        run: cd dist && zip -qry ../ShapeLarper-linux-x64.zip "Shape Larper-linux-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: shape-larper-${{ matrix.target }}
          path: |
            ShapeLarper-*.zip
            dist/ShapeLarper-*.zip
            dist/ShapeLarper-*.exe
            dist/*.blockmap
            dist/latest.yml

  # Publish versioned assets, including the NSIS auto-update feed.
  release:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          V=$(node -p "require('./package.json').version")
          # one release per version, so old versions stay downloadable
          shopt -s globstar nullglob
          assets=(out/**/*.zip out/**/*.exe out/**/*.blockmap out/**/latest.yml)
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" "${assets[@]}" --target "$GITHUB_SHA" --latest --title "Shape Larper v$V" --notes "Windows: run the Setup installer to enable in-game automatic updates, or extract the portable ZIP. Built from $GITHUB_SHA."
