function wmBlur(){setTimeout(()=>{if(!WM)return;let f=document.hasFocus();for(const r of [WP,...WE.values()])try{if(r&&!r.w.closed&&r.w.document.hasFocus())f=1}catch(_){}if(!f)lostFocus()},80)}
// mouse: screen coords give both the aim point in the world and, in the player window, the UI point
function wmMouse(r,e){const w=r.w;CL=r.kind=='p'?1:2;
 // only the player window never moves, so only it can calibrate; moving windows report stale screen coords
 if(!NAT&&r.kind=='p'&&(e.screenX||e.screenY)){const ox=e.screenX-e.clientX-w.screenX,oy=e.screenY-e.clientY-w.screenY;if(ox>=0&&ox<60&&oy>=0&&oy<200){WOX=ox;WOY=oy}}
 // desktop app: the OS cursor stream is the only aim source
 if(!NAT){if(r.kind=='p'||r.lx==null){MSX=e.screenX;MSY=e.screenY}else{MSX=r.lx+wox()+e.clientX;MSY=r.ly+woy()+e.clientY}MSRC=1}
 if(r.kind=='p'){const s=Math.min(w.innerWidth/W,w.innerHeight/H);MU.x=(e.clientX-(w.innerWidth-W*s)/2)/s;MU.y=(e.clientY-(w.innerHeight-H*s)/2)/s}
 wmAim()}
function wmAim(){if(MSRC&&MSX!=null&&P){M.x=P.x+(MSX-CX)/WSC;M.y=P.y+(MSY-CY)/WSC}}
// camera: the player is always drawn at the centre of the player window's content
function wmPre(){if(!WP)return;const w=WP.w;if(w.closed){wmLost();return}
 if(!NAT&&WOX<0&&w.outerWidth>0){WOX=Math.max(0,(w.outerWidth-w.innerWidth)/2);WOY=Math.max(0,w.outerHeight-w.innerHeight-WOX)}
 CX=w.screenX+wox()+(w.innerWidth||PWW)/2;CY=w.screenY+woy()+(w.innerHeight||PWH)/2;wmAim()}
const wpos=e=>({x:CX+(e.x-P.x)*WSC,y:CY+(e.y-P.y)*WSC});
const inS=(c,s,m)=>c.x>s.x-m&&c.x<s.x+s.w+m&&c.y>s.y-m&&c.y<s.y+s.h+m;
function guard(r){const w=r.w;if(w.closed||!w.innerWidth)return;if((w.innerWidth!=r.iw||w.innerHeight!=r.ih)&&t-r.rt>.3){r.rt=t;try{w.resizeTo(w.outerWidth+r.iw-w.innerWidth,w.outerHeight+r.ih-w.innerHeight)}catch(_){}}}
// open, close and move enemy/boss windows to match the world
function wmSync(){if(!P)return;const s=scr(),want=new Map();let ch=0;
 for(const [e] of E.filter(e=>!e.dead).map(e=>[e,dist(e,P)]).sort((a,b)=>a[1]-b[1])){if(want.size>=WMAX)break;want.set('e'+e.id,e)}
 if(boss)want.set('boss',boss);
 for(const [k,r] of WE){const e=want.get(k);if(!e||r.w.closed||(k!='boss'&&!inS(wpos(e),s,30))){try{if(!r.w.closed){r.w.close();ch=1}}catch(_){}WE.delete(k)}}
 for(const [k,e] of want){const b=k=='boss',z=b?BWS:EWS,c=wpos(e);let r=WE.get(k);
  // windows never leave the screen (the OS would push them back): at the edge they pin and show their entity centred
  const far=!inS(c,s,0);if(!r&&!b&&!inS(c,s,-10))continue;const qx=cl(c.x,s.x+z/2,s.x+s.w-z/2),qy=cl(c.y,s.y+z/2,s.y+s.h-z/2),pin=qx!=c.x||qy!=c.y;c.x=qx;c.y=qy;
  if(!r){r=wmOpen(k,z,z,c.x,c.y,b?e.name:ENAME[e.k],b?'b':'e');if(!r)continue;WE.set(k,r);ch=1}
  r.e=e;r.pin=pin;r.far=far;const nx=Math.round(c.x-z/2-wox()),ny=Math.round(c.y-z/2-woy());
  if(nx!==r.lx||ny!==r.ly){if(NAT)MV.push(['sl_'+k,nx,ny]);else try{r.w.moveTo(nx,ny)}catch(_){}r.lx=nx;r.ly=ny}guard(r)}
 guard(WP);if(NAT){if(MV.length)SL.move(MV);MV=[]}else if(ch)try{WP.w.focus()}catch(_){}}
function wmRender(){if(!WP||WP.w.closed||!P)return;wmSync();for(const r of [WP,...WE.values()])if(!r.w.closed)try{wmDraw(r)}catch(_){}}
// draw the slice of the world that sits behind this window on the desktop
function wmDraw(r){const w=r.w,d=w.devicePixelRatio||1,iw=w.innerWidth||r.iw,ih=w.innerHeight||r.ih,bw=Math.round(iw*d),bh=Math.round(ih*d);
 if(r.cv.width!=bw||r.cv.height!=bh){r.cv.width=bw;r.cv.height=bh}
 g=r.c;CW=r.kind=='p'?1:2;const nx=NAT&&r.kind!='p'&&r.lx!=null,wx=nx?r.lx:w.screenX,wy=nx?r.ly:w.screenY;let tx=CX-P.x*WSC-(wx+wox())+SX*WSC,ty=CY-P.y*WSC-(wy+woy())+SY*WSC;
 if(r.pin&&r.e){tx=iw/2-r.e.x*WSC+SX*WSC;ty=ih/2-r.e.y*WSC+SY*WSC}
 g.setTransform(d*WSC,0,0,d*WSC,d*tx,d*ty);VW={x0:-tx/WSC,y0:-ty/WSC,x1:(iw-tx)/WSC,y1:(ih-ty)/WSC};
 drawWorld();xhair();VW=null;g.setTransform(d,0,0,d,0,0);
 if(flash>0){g.fillStyle=`rgba(${FLC},${flash*.5*CFG.fl})`;g.fillRect(0,0,iw,ih)}
 if(r.kind=='p'){const s=Math.min(iw/W,ih/H);g.setTransform(d*s,0,0,d*s,d*(iw-W*s)/2,d*(ih-H*s)/2);vignette(W,H);if(S!='title')hud();banDraw();overlays();tipDraw()}
 else wmFrame(r,iw,ih)}
// enemy and boss window chrome: coloured frame, name, health
function wmFrame(r,iw,ih){const e=r.e;if(!e)return;const b=r.kind=='b',c=e.c,lw=b?6:3,f=cl(e.hp/(e.mhp||1),0,1);
 g.strokeStyle=c;g.lineWidth=lw;g.strokeRect(lw/2,lw/2,iw-lw,ih-lw);
 if(b){T(e.name,iw/2,24,18,c);g.strokeStyle='#4a4580';g.lineWidth=2;g.strokeRect(20,ih-30,iw-40,12);g.fillStyle=c;g.fillRect(20,ih-30,(iw-40)*f,12);
  g.fillStyle='#fff';g.fillRect(20+(iw-40)*.33,ih-30,2,12);g.fillRect(20+(iw-40)*.66,ih-30,2,12);
  if(r.far){const a=ang(P,e),ax=iw/2+Math.cos(a)*(iw/2-34),ay=ih/2+Math.sin(a)*(ih/2-34);g.fillStyle=c;g.beginPath();g.moveTo(ax+Math.cos(a)*16,ay+Math.sin(a)*16);g.lineTo(ax+Math.cos(a+2.4)*14,ay+Math.sin(a+2.4)*14);g.lineTo(ax+Math.cos(a-2.4)*14,ay+Math.sin(a-2.4)*14);g.fill();T('OFF-SCREEN',iw/2,46,12,'#9a96c8','center','normal')}
  if(e.sh>0)T('PHASE SHIELD',iw/2,ih-46,13,'#fff');else if(e.n==3&&e.intro<=0)T(e.m=='dn'?'EXPOSED':'ARMORED',iw/2,ih-46,13,e.m=='dn'?'#fff':c)}
 else{T(ENAME[e.k],10,15,12,c,'left');if(f<1){g.fillStyle=c;g.fillRect(10,ih-12,(iw-20)*f,4)}}}

function statusDraw(){g.fillStyle='#07060f';g.fillRect(0,0,W,H);T('SHAPE LARPER',W/2,160,56,'#5ef2ff');
 if(!WP){T('The player window was closed.',W/2,260,22,'#ff7a90');btn('Reopen windows',W/2-130,310,260,46,wmReopen);btn('End run',W/2-130,370,260,46,toMenu);return}
 T('The game is running in its own windows.',W/2,250,20,'#d8d4ff','center','normal');T('Esc or P pauses  ·  keep this tab open',W/2,282,16,'#9a96c8','center','normal');
 btn(S=='pause'?'Resume':'Pause',W/2-130,330,260,46,()=>{S=S=='pause'?'play':S=='play'?'pause':S});btn('End run',W/2-130,390,260,46,toMenu)}
addEventListener('pagehide',wmStop);
if(NAT)SL.onCursor((x,y)=>{if(WM){MSX=x;MSY=y;MSRC=1}});
