 const duck=G();duck.connect(mus);const drum=G();drum.gain.value=.9;drum.connect(mus);const syn=G();syn.connect(duck);
 // reverb from a generated, darkening impulse response
 const len=A.sampleRate*2.6|0,ir=A.createBuffer(2,len,A.sampleRate);
 for(let c=0;c<2;c++){const d=ir.getChannelData(c);let v=0;for(let i=0;i<len;i++){v+=(Math.random()*2-1-v)*(.2+.7*(1-i/len));d[i]=v*Math.pow(1-i/len,2.6)}}
